[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "likeforlike"
version = "0.1.0"
description = "Like-for-like retail sales on a 4-5-4 calendar with comp-store rules, 53rd-week restatement and an exact growth bridge, in a Power BI model checked against SQL."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "likeforlike contributors" }]
dependencies = [
    "duckdb>=1.1,<2",
    "jinja2>=3.1",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
likeforlike = "likeforlike.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/likeforlike"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "likeforlike/sql"
"comp_policy.yaml" = "likeforlike/comp_policy.yaml"
